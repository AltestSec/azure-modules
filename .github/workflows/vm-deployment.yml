name: 'VM Resources Deployment'

on:
  push:
    branches:
      - main
      - az_payground/**
    paths:
      - '.github/workflows/vm-deployment.yml'
      - 'modules/vm-resources/**'
      - 'main.tf'
      - 'tfvar.tf'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: 'Terraform Action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      resource_prefix:
        description: 'Resource prefix'
        required: true
        default: 'omerzlikin'
        type: string
      location:
        description: 'Azure Location'
        required: true
        default: 'westeurope'
        type: choice
        options:
          - eastus
          - westeurope
      pool_type:
        description: 'VM Pool Type'
        required: true
        default: 'web'
        type: choice
        options:
          - web
          - api
          - worker
      vm_count:
        description: 'Number of VMs'
        required: true
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
      vm_size:
        description: 'VM Size'
        required: true
        default: 'Standard_B2als_v2'
        type: choice
        options:
          - Standard_B1s
          - Standard_B2s
          - Standard_B2als_v2
          - Standard_D2s_v3
          - Standard_D4s_v3
      due_date:
        description: 'Due date for resources (YYYY-MM-DD)'
        required: false
        default: ''
        type: string
  pull_request:
    branches:
      - az_payground/**
    paths:
      - '.github/workflows/vm-deployment.yml'

env:
  TF_WORKING_DIR: ${{ github.workspace }}
  ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
  ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
  ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
  ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
  ARM_USE_MSI: false

jobs:
  terraform-vm-resources:
    name: 'Deploy VM Resources'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.0

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Setup Terraform Backend for VM Resources
      run: |
        echo "Using Shared Terraform Backend Storage for VM Resources..."
        
        # Set variables from workflow inputs or defaults
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          RESOURCE_PREFIX="${{ github.event.inputs.resource_prefix }}"
          ENVIRONMENT="${{ github.event.inputs.environment }}"
          LOCATION="${{ github.event.inputs.location }}"
          DUE_DATE="${{ github.event.inputs.due_date }}"
        else
          RESOURCE_PREFIX="omerzlikin"
          ENVIRONMENT="dev"
          LOCATION="westeurope"
          DUE_DATE=""
        fi
        
        # Calculate due date if not provided
        if [ -z "$DUE_DATE" ]; then
          DUE_DATE=$(date -d "+5 days" +%Y-%m-%d)
        fi
        
        # Consolidated backend naming - SHARED with infrastructure
        BACKEND_RG_NAME="${RESOURCE_PREFIX}-tfstate-rg"
        BACKEND_STORAGE_NAME="${RESOURCE_PREFIX}tfstatestorage"
        BACKEND_CONTAINER_NAME="tfstate-${ENVIRONMENT}"
        BACKEND_KEY="vm-resources.tfstate"
        
        echo "Consolidated Backend Configuration:"
        echo "Resource Prefix: $RESOURCE_PREFIX"
        echo "Environment: $ENVIRONMENT"
        echo "Location: $LOCATION"
        echo "Due Date: $DUE_DATE"
        echo "Backend Resource Group: $BACKEND_RG_NAME (SHARED)"
        echo "Backend Storage Account: $BACKEND_STORAGE_NAME (SHARED)"
        echo "Backend Container: $BACKEND_CONTAINER_NAME (SHARED)"
        echo "Backend Key: $BACKEND_KEY (VM-RESOURCES-SPECIFIC)"
        
        # Backend storage should already exist from infrastructure deployment
        # Just verify it exists
        if ! az storage account show --name "$BACKEND_STORAGE_NAME" --resource-group "$BACKEND_RG_NAME" --output none 2>/dev/null; then
          echo "❌ Backend storage not found. Please run Infrastructure Deployment first."
          exit 1
        fi
        
        echo "✅ Backend storage verified"
        
        # Export for next steps
        echo "BACKEND_RG_NAME=$BACKEND_RG_NAME" >> $GITHUB_ENV
        echo "BACKEND_STORAGE_NAME=$BACKEND_STORAGE_NAME" >> $GITHUB_ENV
        echo "BACKEND_CONTAINER_NAME=$BACKEND_CONTAINER_NAME" >> $GITHUB_ENV
        echo "BACKEND_KEY=$BACKEND_KEY" >> $GITHUB_ENV
        echo "RESOURCE_PREFIX=$RESOURCE_PREFIX" >> $GITHUB_ENV
        echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_ENV
        echo "LOCATION=$LOCATION" >> $GITHUB_ENV
        echo "DUE_DATE=$DUE_DATE" >> $GITHUB_ENV

    - name: Terraform Init
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        terraform init \
          -backend-config="resource_group_name=${{ env.BACKEND_RG_NAME }}" \
          -backend-config="storage_account_name=${{ env.BACKEND_STORAGE_NAME }}" \
          -backend-config="container_name=${{ env.BACKEND_CONTAINER_NAME }}" \
          -backend-config="key=${{ env.BACKEND_KEY }}" \
          -backend-config="use_azuread_auth=true"

    - name: Terraform Plan/Apply/Destroy
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        # Use environment variables set in previous step
        ACTION="${{ github.event.inputs.action || 'plan' }}"
        POOL_TYPE="${{ github.event.inputs.pool_type || 'web' }}"
        VM_COUNT="${{ github.event.inputs.vm_count || '2' }}"
        VM_SIZE="${{ github.event.inputs.vm_size || 'Standard_B2als_v2' }}"
        
        if [ "$ACTION" == "plan" ]; then
          echo "🔍 Planning VM Resources Deployment..."
          terraform plan \
            -var="deploy_infrastructure=false" \
            -var="deploy_vms=true" \
            -var="deploy_avd=false" \
            -var="deploy_service_bus=false" \
            -var="resource_prefix=${{ env.RESOURCE_PREFIX }}" \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -var="location=${{ env.LOCATION }}" \
            -var="pool_type=$POOL_TYPE" \
            -var="vm_count=$VM_COUNT" \
            -var="vm_size=$VM_SIZE" \
            -var="create_resource_group=false" \
            -var="subscription_id=${{ env.ARM_SUBSCRIPTION_ID }}" \
            -var="tenant_id=${{ env.ARM_TENANT_ID }}" \
            -var="due_date=${{ env.DUE_DATE }}" \
            -out=vm-plan
        elif [ "$ACTION" == "apply" ]; then
          echo "🚀 Applying VM Resources Deployment..."
          terraform apply -auto-approve \
            -var="deploy_infrastructure=false" \
            -var="deploy_vms=true" \
            -var="deploy_avd=false" \
            -var="deploy_service_bus=false" \
            -var="resource_prefix=${{ env.RESOURCE_PREFIX }}" \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -var="location=${{ env.LOCATION }}" \
            -var="pool_type=$POOL_TYPE" \
            -var="vm_count=$VM_COUNT" \
            -var="vm_size=$VM_SIZE" \
            -var="create_resource_group=false" \
            -var="subscription_id=${{ env.ARM_SUBSCRIPTION_ID }}" \
            -var="tenant_id=${{ env.ARM_TENANT_ID }}" \
            -var="due_date=${{ env.DUE_DATE }}"
          echo "✅ VM Resources deployment completed"
        elif [ "$ACTION" == "destroy" ]; then
          echo "🗑️ Destroying VM Resources..."
          terraform destroy -auto-approve \
            -var="deploy_infrastructure=false" \
            -var="deploy_vms=true" \
            -var="deploy_avd=false" \
            -var="deploy_service_bus=false" \
            -var="resource_prefix=${{ env.RESOURCE_PREFIX }}" \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -var="location=${{ env.LOCATION }}" \
            -var="pool_type=$POOL_TYPE" \
            -var="vm_count=$VM_COUNT" \
            -var="vm_size=$VM_SIZE" \
            -var="create_resource_group=false" \
            -var="subscription_id=${{ env.ARM_SUBSCRIPTION_ID }}" \
            -var="tenant_id=${{ env.ARM_TENANT_ID }}" \
            -var="due_date=${{ env.DUE_DATE }}"
          echo "✅ VM Resources destruction completed"
        fi