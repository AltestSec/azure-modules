name: 'Terraform Infrastructure'

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'az_payground/**'
  pull_request:
    branches:
      - main
    paths:
      - 'az_payground/**'
  workflow_dispatch:
    inputs:
      pool_type:
        description: 'VM Pool Type'
        required: true
        default: 'web'
        type: choice
        options:
          - web
          - api
          - worker
      vm_count:
        description: 'Number of VMs'
        required: true
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
      vm_size:
        description: 'VM Size'
        required: true
        default: 'Standard_B2als_v2'
        type: choice
        options:
          - Standard_B1s
          - Standard_B2s
          - Standard_B2als_v2
          - Standard_D2s_v3
          - Standard_D4s_v3
      environment:
        description: 'Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: 'Terraform Action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  TF_WORKING_DIR: './az_payground'
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  terraform-validate:
    name: 'Terraform Validate'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.0

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Setup Terraform Backend
      run: |
        # Create storage account for Terraform state if it doesn't exist
        az group create --name tfstate-rg --location "West Europe" --output none || true
        STORAGE_NAME="tfstate$(date +%s)"
        az storage account create \
          --name $STORAGE_NAME \
          --resource-group tfstate-rg \
          --location "West Europe" \
          --sku Standard_LRS \
          --output none || true
        az storage container create \
          --name tfstate \
          --account-name $STORAGE_NAME \
          --output none || true
        echo "STORAGE_ACCOUNT_NAME=$STORAGE_NAME" >> $GITHUB_ENV

    - name: Terraform Init
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        terraform init \
          -backend-config="storage_account_name=${{ env.STORAGE_ACCOUNT_NAME }}" \
          -backend-config="resource_group_name=tfstate-rg"

    - name: Terraform Validate
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: terraform validate

    - name: Terraform Format Check
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: terraform fmt -check

  terraform-plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.0

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Set Variables
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "POOL_TYPE=${{ github.event.inputs.pool_type }}" >> $GITHUB_ENV
          echo "VM_COUNT=${{ github.event.inputs.vm_count }}" >> $GITHUB_ENV
          echo "VM_SIZE=${{ github.event.inputs.vm_size }}" >> $GITHUB_ENV
          echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
        else
          echo "POOL_TYPE=web" >> $GITHUB_ENV
          echo "VM_COUNT=2" >> $GITHUB_ENV
          echo "VM_SIZE=Standard_B2s" >> $GITHUB_ENV
          echo "ENVIRONMENT=dev" >> $GITHUB_ENV
        fi

    - name: Terraform Init
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        terraform init \
          -backend-config="storage_account_name=${{ env.STORAGE_ACCOUNT_NAME }}" \
          -backend-config="resource_group_name=tfstate-rg"

    - name: Terraform Plan
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        terraform plan \
          -var="pool_type=${{ env.POOL_TYPE }}" \
          -var="vm_count=${{ env.VM_COUNT }}" \
          -var="vm_size=${{ env.VM_SIZE }}" \
          -var="environment=${{ env.ENVIRONMENT }}" \
          -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
          -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
          -out=tfplan

    - name: Upload Plan
      uses: actions/upload-artifact@v4
      with:
        name: terraform-plan
        path: ${{ env.TF_WORKING_DIR }}/tfplan

  terraform-apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.event.inputs.action == 'apply' && github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.environment }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.0

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Download Plan
      uses: actions/download-artifact@v4
      with:
        name: terraform-plan
        path: ${{ env.TF_WORKING_DIR }}

    - name: Terraform Init
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        terraform init \
          -backend-config="storage_account_name=${{ env.STORAGE_ACCOUNT_NAME }}" \
          -backend-config="resource_group_name=tfstate-rg"

    - name: Terraform Apply
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: terraform apply -auto-approve tfplan

    - name: Setup VM Scheduling
      run: |
        # Configure advanced VM scheduling
        RG_NAME="rg-playground"
        
        # Create Function App for Hungarian holidays and work hours scheduling
        az functionapp create \
          --resource-group $RG_NAME \
          --consumption-plan-location "West Europe" \
          --runtime python \
          --runtime-version 3.9 \
          --functions-version 4 \
          --name "vm-scheduler-${{ github.event.inputs.environment }}" \
          --storage-account "vmschedulerstorage"
        
        echo "VM scheduling configured for:"
        echo "Environment: ${{ github.event.inputs.environment }}"
        echo "Pool type: ${{ github.event.inputs.pool_type }}"
        echo "VM count: ${{ github.event.inputs.vm_count }}"