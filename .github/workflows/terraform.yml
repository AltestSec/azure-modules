name: 'Terraform Infrastructure'

on:
  push:
    branches:
      - main
      - develop
      - az_payground/**
    paths:
      - 'az_payground/**'
  pull_request:
    branches:
      - main
    paths:
      - 'az_payground/**'
  workflow_dispatch:
    inputs:
      pool_type:
        description: 'VM Pool Type'
        required: true
        default: 'web'
        type: choice
        options:
          - web
          - api
          - worker
      vm_count:
        description: 'Number of VMs'
        required: true
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
      vm_size:
        description: 'VM Size'
        required: true
        default: 'Standard_B2als_v2'
        type: choice
        options:
          - Standard_B1s
          - Standard_B2s
          - Standard_B2als_v2
          - Standard_D2s_v3
          - Standard_D4s_v3
      environment:
        description: 'Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: 'Terraform Action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      resource_prefix:
        description: 'Resource prefix (e.g., omerzlikin-3444d253-9433)'
        required: true
        default: 'omerzlikin'
        type: string
      due_date:
        description: 'Due date for resources (YYYY-MM-DD)'
        required: false
        default: '2026-02-12'
        type: string
      location:
        description: 'Azure Location'
        required: true
        default: 'westeurope'
        type: choice
        options:
          - eastus
          - westeurope


env:
  TF_WORKING_DIR: ${{ github.workspace }}
  # Terraform Azure Provider Environment Variables
  ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
  ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
  ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
  ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
  ARM_USE_MSI: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  terraform-validate:
    name: 'Terraform Validate'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.0

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Setup Terraform Backend
      run: |
        # Set resource prefix from input or default
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          RESOURCE_PREFIX="${{ github.event.inputs.resource_prefix }}"
          DUE_DATE="${{ github.event.inputs.due_date }}"
        else
          RESOURCE_PREFIX="omerzlikin"
          DUE_DATE="2026-02-12"
        fi
        
        LOCATION="${{ github.event.inputs.location }}"
        # Use consistent storage account naming (without timestamp to ensure consistency across jobs)
        #STORAGE_NAME="${RESOURCE_PREFIX}tfstate$(echo '${{ github.run_id }}' | tail -c 6)"
        STORAGE_NAME="${RESOURCE_PREFIX}tfstates"
        RG_NAME="${RESOURCE_PREFIX}-tfstate-rg"
        
        echo "Creating Terraform state storage with prefix: $RESOURCE_PREFIX"
        echo "Storage account: $STORAGE_NAME"
        echo "Resource group: $RG_NAME"
        echo "Due date: $DUE_DATE"
        
        # Create resource group for Terraform state
        az group create --name "$RG_NAME" --location "$LOCATION" --output none || true
        
        # Create storage account with versioning and RBAC
        az storage account create \
          --name "$STORAGE_NAME" \
          --resource-group "$RG_NAME" \
          --location "$LOCATION" \
          --sku Standard_LRS \
          --kind StorageV2 \
          --allow-blob-public-access false \
          --tags owner=omerzlikin createdBy=terraform dueDate="$DUE_DATE" \
          --output none || true

        az storage account blob-service-properties update \
          --resource-group "$RG_NAME" \
          --account-name "$STORAGE_NAME" \
          --enable-versioning true
        
        # Create container for Terraform state
        az storage container create \
          --name "$STORAGE_NAME-${{ github.event.inputs.environment }}" \
          --account-name "$STORAGE_NAME" \
          --auth-mode login \
          --output none || true
        
        # Get current user/service principal object ID
        CURRENT_USER_ID=$(az ad signed-in-user show --query id -o tsv 2>/dev/null || az account show --query user.name -o tsv)
        
        #Test for role assignment
        #az role assignment list --assignee "${env.AZURE_CLIENT_ID)" --scope "$(az storage account show -n "$STORAGE_NAME" --query id -o tsv)" -o table
        #az role assignment list --assignee "${ARM_CLIENT_ID}" --scope "$(az storage account show -n "$STORAGE_NAME" --query id -o tsv)" -o table

        # Assign Storage Blob Data Contributor role for RBAC access
        SP_OBJ_ID="$(az ad sp show --id "${ARM_CLIENT_ID}" --query id -o tsv)"
        echo $SP_OBJ_ID
        #az role assignment create \
        #  --assignee-object-id "${SP_OBJ_ID}" \
        #  --role "Storage Blob Data Contributor" \
        #  --assignee-principal-type ServicePrincipal
          #--scope "/subscriptions/$(az account show --query id -o tsv)/resourceGroups/$RG_NAME/providers/Microsoft.Storage/storageAccounts/$STORAGE_NAME" \
        #  --scope "$(az storage account show -g "$RG_NAME" -n "$STORAGE_NAME" --query id -o tsv)" \
        #  --output none || true
        SA_ID="$(az storage account show -g "$RG_NAME" -n "$STORAGE_NAME" --query id -o tsv)"

        #az role assignment list --assignee "$SP_OBJ_ID" --scope "$SA_ID" -o table

        # create only if missing
        if ! az role assignment list --assignee "$SP_OBJ_ID" --scope "$SA_ID" \
          --query "[?roleDefinitionName=='Storage Blob Data Contributor'] | length(@)" -o tsv | grep -qx 1; then
          az role assignment create \
            --assignee-object-id "$SP_OBJ_ID" \
            --assignee-principal-type ServicePrincipal \
            --role "Storage Blob Data Contributor" \
            --scope "$SA_ID" \
            -o none
        fi
        
        echo "Let's wait 5 minutes until the role assignment is assignet"
        sleep 60

        echo "Setting ACL for Terraform SP..."
        # az storage fs access set \
        #   --account-name "$STORAGE_NAME" \
        #   --file-system tfstate \
        #   --path "/" \
        #   --acl "user:${SP_OBJ_ID}:rwx,default:user:${SP_OBJ_ID}:rwx" \
        #   --auth-mode login
        
        echo "STORAGE_ACCOUNT_NAME=$STORAGE_NAME" >> $GITHUB_ENV
        echo "TFSTATE_RG_NAME=$RG_NAME" >> $GITHUB_ENV
        echo "RESOURCE_PREFIX=$RESOURCE_PREFIX" >> $GITHUB_ENV
        echo "DUE_DATE=$DUE_DATE" >> $GITHUB_ENV

    - name: Test Storage Setup
      run: |
        set -euo pipefail

        echo "Check storage account exists..."
        if ! az storage account show -n "${{ env.STORAGE_ACCOUNT_NAME }}" -g "$TFSTATE_RG_NAME" --query "name" -o tsv >/dev/null 2>&1; then
          echo "Storage account ${{ env.STORAGE_ACCOUNT_NAME }} not found in RG $TFSTATE_RG_NAME"
          exit 1
        fi

        echo "Check container exists..."
        if ! az storage container exists \
          --account-name "${{ env.STORAGE_ACCOUNT_NAME }}" \
          --name "${{ env.STORAGE_ACCOUNT_NAME }}-${{ github.event.inputs.environment }}" \
          --auth-mode login \
          --query exists -o tsv 2>/dev/null | grep -qx true; then
          echo "Container ${{ env.STORAGE_ACCOUNT_NAME }}-${{ github.event.inputs.environment }} does not exist (or no access)."
          exit 1
        fi

        echo "Test blob access (AAD)..."
        az storage blob list \
          --account-name "${{ env.STORAGE_ACCOUNT_NAME }}" \
          --container-name "${{ env.STORAGE_ACCOUNT_NAME }}-${{ github.event.inputs.environment }}" \
          --auth-mode login \
          --num-results 1 \
          --query "[0].name" -o tsv >/dev/null

    - name: Terraform Init
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        terraform init \
          -backend-config="storage_account_name=${{ env.STORAGE_ACCOUNT_NAME }}" \
          -backend-config="resource_group_name=${{ env.TFSTATE_RG_NAME }}" \
          -backend-config="container_name=${{ env.STORAGE_ACCOUNT_NAME }}-${{ github.event.inputs.environment }}" \
          -backend-config="key=${{ env.ENVIRONMENT }}/terraform.tfstate" \
          -backend-config="use_azuread_auth=true"

    - name: Terraform Validate
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: terraform validate

    - name: Terraform Format Check
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: terraform fmt -check

  terraform-plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.0

    - name: Setup Infracost
      uses: infracost/actions/setup@v2
      with:
        api-key: ${{ secrets.INFRACOST_API_KEY }}

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Set Variables
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "POOL_TYPE=${{ github.event.inputs.pool_type }}" >> $GITHUB_ENV
          echo "VM_COUNT=${{ github.event.inputs.vm_count }}" >> $GITHUB_ENV
          echo "VM_SIZE=${{ github.event.inputs.vm_size }}" >> $GITHUB_ENV
          echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          echo "RESOURCE_PREFIX=${{ github.event.inputs.resource_prefix }}" >> $GITHUB_ENV
          echo "DUE_DATE=${{ github.event.inputs.due_date }}" >> $GITHUB_ENV
        else
          echo "POOL_TYPE=web" >> $GITHUB_ENV
          echo "VM_COUNT=2" >> $GITHUB_ENV
          echo "VM_SIZE=Standard_B2als_v2" >> $GITHUB_ENV
          echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          echo "RESOURCE_PREFIX=omerzlikin" >> $GITHUB_ENV
          echo "DUE_DATE=2026-02-12" >> $GITHUB_ENV
        fi
        
        # Use consistent storage account naming (without timestamp to ensure consistency across jobs)
        STORAGE_NAME="${{ env.RESOURCE_PREFIX }}tfstate$(echo '${{ github.run_id }}' | tail -c 6)"
        RG_NAME="${{ env.RESOURCE_PREFIX }}-tfstate-rg"
        
        echo "STORAGE_ACCOUNT_NAME=$STORAGE_NAME" >> $GITHUB_ENV
        echo "TFSTATE_RG_NAME=$RG_NAME" >> $GITHUB_ENV

    - name: Terraform Init
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        terraform init \
          -backend-config="storage_account_name=${{ env.STORAGE_ACCOUNT_NAME }}" \
          -backend-config="resource_group_name=${{ env.TFSTATE_RG_NAME }}" \
          -backend-config="use_azuread_auth=true"

    - name: Terraform Plan
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        terraform plan \
          -var="pool_type=${{ env.POOL_TYPE }}" \
          -var="vm_count=${{ env.VM_COUNT }}" \
          -var="vm_size=${{ env.VM_SIZE }}" \
          -var="environment=${{ env.ENVIRONMENT }}" \
          -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
          -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
          -out=tfplan

    - name: Generate Cost Estimate
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        # Generate cost breakdown for the planned infrastructure
        infracost breakdown --path . \
          --terraform-var="pool_type=${{ env.POOL_TYPE }}" \
          --terraform-var="vm_count=${{ env.VM_COUNT }}" \
          --terraform-var="vm_size=${{ env.VM_SIZE }}" \
          --terraform-var="environment=${{ env.ENVIRONMENT }}" \
          --terraform-var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
          --terraform-var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
          --format json \
          --out-file infracost-base.json

    - name: Generate Cost Summary
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        # Generate human-readable cost summary
        infracost output --path infracost-base.json --format table > cost-estimate.txt
        infracost output --path infracost-base.json --format html > cost-estimate.html
        
        echo "## 💰 Infrastructure Cost Estimate" >> cost-summary.md
        echo "" >> cost-summary.md
        echo "**Configuration:**" >> cost-summary.md
        echo "- Resource Prefix: ${{ env.RESOURCE_PREFIX }}" >> cost-summary.md
        echo "- Pool Type: ${{ env.POOL_TYPE }}" >> cost-summary.md
        echo "- VM Count: ${{ env.VM_COUNT }}" >> cost-summary.md
        echo "- VM Size: ${{ env.VM_SIZE }}" >> cost-summary.md
        echo "- Environment: ${{ env.ENVIRONMENT }}" >> cost-summary.md
        echo "- Due Date: ${{ env.DUE_DATE }}" >> cost-summary.md
        echo "" >> cost-summary.md
        echo "**Monthly Cost Breakdown:**" >> cost-summary.md
        echo '```' >> cost-summary.md
        cat cost-estimate.txt >> cost-summary.md
        echo '```' >> cost-summary.md
        
        # Display cost estimate in workflow logs
        echo "=== INFRASTRUCTURE COST ESTIMATE ==="
        cat cost-estimate.txt
        echo "===================================="

    - name: Comment Cost Estimate on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = '${{ env.TF_WORKING_DIR }}/cost-summary.md';
          
          if (fs.existsSync(path)) {
            const costSummary = fs.readFileSync(path, 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: costSummary
            });
          }

    - name: Upload Plan and Cost Estimates
      uses: actions/upload-artifact@v4
      with:
        name: terraform-plan-with-costs
        path: |
          ${{ env.TF_WORKING_DIR }}/tfplan
          ${{ env.TF_WORKING_DIR }}/cost-estimate.txt
          ${{ env.TF_WORKING_DIR }}/cost-estimate.html
          ${{ env.TF_WORKING_DIR }}/infracost-base.json
          ${{ env.TF_WORKING_DIR }}/cost-summary.md

  terraform-apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.event.inputs.action == 'apply' && github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.environment }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.0

    - name: Setup Infracost
      uses: infracost/actions/setup@v2
      with:
        api-key: ${{ secrets.INFRACOST_API_KEY }}

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Set Variables
      run: |
        echo "POOL_TYPE=${{ github.event.inputs.pool_type }}" >> $GITHUB_ENV
        echo "VM_COUNT=${{ github.event.inputs.vm_count }}" >> $GITHUB_ENV
        echo "VM_SIZE=${{ github.event.inputs.vm_size }}" >> $GITHUB_ENV
        echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
        echo "RESOURCE_PREFIX=${{ github.event.inputs.resource_prefix }}" >> $GITHUB_ENV
        echo "DUE_DATE=${{ github.event.inputs.due_date }}" >> $GITHUB_ENV
        
        # Use consistent storage account naming (without timestamp to ensure consistency across jobs)
        STORAGE_NAME="${{ github.event.inputs.resource_prefix }}tfstate$(echo '${{ github.run_id }}' | tail -c 6)"
        RG_NAME="${{ github.event.inputs.resource_prefix }}-tfstate-rg"
        
        echo "STORAGE_ACCOUNT_NAME=$STORAGE_NAME" >> $GITHUB_ENV
        echo "TFSTATE_RG_NAME=$RG_NAME" >> $GITHUB_ENV

    - name: Download Plan and Cost Estimates
      uses: actions/download-artifact@v4
      with:
        name: terraform-plan-with-costs
        path: ${{ env.TF_WORKING_DIR }}

    - name: Display Pre-Apply Cost Estimate
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        echo "=== PRE-APPLY COST ESTIMATE ==="
        if [ -f "cost-estimate.txt" ]; then
          cat cost-estimate.txt
        else
          echo "Cost estimate file not found"
        fi
        echo "==============================="

    - name: Terraform Init
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        terraform init \
          -backend-config="storage_account_name=${{ env.STORAGE_ACCOUNT_NAME }}" \
          -backend-config="resource_group_name=${{ env.TFSTATE_RG_NAME }}" \
          -backend-config="use_azuread_auth=true"

    - name: Terraform Apply
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        echo "🚀 Applying infrastructure changes..."
        echo "Resource prefix: ${{ env.RESOURCE_PREFIX }}"
        echo "Due date: ${{ env.DUE_DATE }}"
        terraform apply -auto-approve tfplan
        echo "✅ Infrastructure deployment completed"

    - name: Generate Post-Apply Cost Analysis
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        # Generate current state cost analysis
        infracost breakdown --path . \
          --format json \
          --out-file infracost-current.json
        
        # Generate readable cost report
        infracost output --path infracost-current.json --format table > current-costs.txt
        
        echo "=== DEPLOYED INFRASTRUCTURE COSTS ==="
        cat current-costs.txt
        echo "====================================="
        
        # Create deployment summary
        echo "## 🎉 Infrastructure Deployment Complete" > deployment-summary.md
        echo "" >> deployment-summary.md
        echo "**Deployed Configuration:**" >> deployment-summary.md
        echo "- Resource Prefix: ${{ env.RESOURCE_PREFIX }}" >> deployment-summary.md
        echo "- Pool Type: ${{ env.POOL_TYPE }}" >> deployment-summary.md
        echo "- VM Count: ${{ env.VM_COUNT }}" >> deployment-summary.md
        echo "- VM Size: ${{ env.VM_SIZE }}" >> deployment-summary.md
        echo "- Environment: ${{ env.ENVIRONMENT }}" >> deployment-summary.md
        echo "- Due Date: ${{ env.DUE_DATE }}" >> deployment-summary.md
        echo "" >> deployment-summary.md
        echo "**Monthly Operating Costs:**" >> deployment-summary.md
        echo '```' >> deployment-summary.md
        cat current-costs.txt >> deployment-summary.md
        echo '```' >> deployment-summary.md
        echo "" >> deployment-summary.md
        echo "**Next Steps:**" >> deployment-summary.md
        echo "- VMs are configured with auto-shutdown schedules" >> deployment-summary.md
        echo "- Monitor costs in Azure Cost Management" >> deployment-summary.md
        echo "- Review and optimize resource usage regularly" >> deployment-summary.md

    - name: Setup VM Scheduling
      run: |
        # Configure advanced VM scheduling
        RG_NAME="${{ env.RESOURCE_PREFIX }}-rg-playground"
        LOCATION="${{ github.event.inputs.location }}"
        
        # Create Function App for Hungarian holidays and work hours scheduling
        az functionapp create \
          --resource-group $RG_NAME \
          --consumption-plan-location "$LOCATION" \
          --runtime python \
          --runtime-version 3.9 \
          --functions-version 4 \
          --name "${{ env.RESOURCE_PREFIX }}-vm-scheduler-${{ env.ENVIRONMENT }}" \
          --storage-account "${{ env.RESOURCE_PREFIX }}vmschedulerstorage" \
          --tags owner=omerzlikin createdBy=terraform dueDate="${{ env.DUE_DATE }}" \
          || echo "Function app creation skipped (may already exist)"
        
        echo "VM scheduling configured for:"
        echo "Environment: ${{ env.ENVIRONMENT }}"
        echo "Pool type: ${{ env.POOL_TYPE }}"
        echo "VM count: ${{ env.VM_COUNT }}"
        echo "Resource prefix: ${{ env.RESOURCE_PREFIX }}"

    - name: Upload Deployment Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deployment-results
        path: |
          ${{ env.TF_WORKING_DIR }}/current-costs.txt
          ${{ env.TF_WORKING_DIR }}/infracost-current.json
          ${{ env.TF_WORKING_DIR }}/deployment-summary.md

  terraform-destroy:
    name: 'Terraform Destroy'
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'destroy' && github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.environment }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.0

    - name: Setup Infracost
      uses: infracost/actions/setup@v2
      with:
        api-key: ${{ secrets.INFRACOST_API_KEY }}

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Set Variables
      run: |
        echo "POOL_TYPE=${{ github.event.inputs.pool_type }}" >> $GITHUB_ENV
        echo "VM_COUNT=${{ github.event.inputs.vm_count }}" >> $GITHUB_ENV
        echo "VM_SIZE=${{ github.event.inputs.vm_size }}" >> $GITHUB_ENV
        echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
        echo "RESOURCE_PREFIX=${{ github.event.inputs.resource_prefix }}" >> $GITHUB_ENV
        echo "DUE_DATE=${{ github.event.inputs.due_date }}" >> $GITHUB_ENV
        
        # Use consistent storage account naming (without timestamp to ensure consistency across jobs)
        STORAGE_NAME="${{ github.event.inputs.resource_prefix }}tfstate$(echo '${{ github.run_id }}' | tail -c 6)"
        RG_NAME="${{ github.event.inputs.resource_prefix }}-tfstate-rg"
        
        echo "STORAGE_ACCOUNT_NAME=$STORAGE_NAME" >> $GITHUB_ENV
        echo "TFSTATE_RG_NAME=$RG_NAME" >> $GITHUB_ENV

    - name: Terraform Init
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        terraform init \
          -backend-config="storage_account_name=${{ env.STORAGE_ACCOUNT_NAME }}" \
          -backend-config="resource_group_name=${{ env.TFSTATE_RG_NAME }}" \
          -backend-config="use_azuread_auth=true"

    - name: Generate Pre-Destroy Cost Analysis
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        # Show current costs before destruction
        infracost breakdown --path . \
          --format table > pre-destroy-costs.txt
        
        echo "=== RESOURCES TO BE DESTROYED ==="
        cat pre-destroy-costs.txt
        echo "================================="
        
        # Calculate monthly savings
        MONTHLY_COST=$(infracost breakdown --path . --format json | jq -r '.totalMonthlyCost // "0"')
        echo "💰 Monthly cost savings after destroy: \$${MONTHLY_COST}"

    - name: Terraform Destroy
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        echo "🗑️ Destroying infrastructure..."
        echo "Resource prefix: ${{ env.RESOURCE_PREFIX }}"
        terraform destroy -auto-approve \
          -var="pool_type=${{ env.POOL_TYPE }}" \
          -var="vm_count=${{ env.VM_COUNT }}" \
          -var="vm_size=${{ env.VM_SIZE }}" \
          -var="environment=${{ env.ENVIRONMENT }}" \
          -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
          -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}"
        echo "✅ Infrastructure destruction completed"

    - name: Generate Destruction Summary
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        echo "## 🗑️ Infrastructure Destruction Complete" > destruction-summary.md
        echo "" >> destruction-summary.md
        echo "**Destroyed Configuration:**" >> destruction-summary.md
        echo "- Resource Prefix: ${{ env.RESOURCE_PREFIX }}" >> destruction-summary.md
        echo "- Pool Type: ${{ env.POOL_TYPE }}" >> destruction-summary.md
        echo "- VM Count: ${{ env.VM_COUNT }}" >> destruction-summary.md
        echo "- VM Size: ${{ env.VM_SIZE }}" >> destruction-summary.md
        echo "- Environment: ${{ env.ENVIRONMENT }}" >> destruction-summary.md
        echo "- Due Date: ${{ env.DUE_DATE }}" >> destruction-summary.md
        echo "" >> destruction-summary.md
        echo "**Cost Savings:**" >> cost-summary.md
        echo '```' >> destruction-summary.md
        cat pre-destroy-costs.txt >> destruction-summary.md
        echo '```' >> destruction-summary.md
        echo "" >> destruction-summary.md
        echo "All resources have been successfully removed from Azure." >> destruction-summary.md

    - name: Upload Destruction Results
