name: 'Terraform Infrastructure'

on:
  push:
    branches:
      - main
      - develop
      - az_payground/**
    paths:
      - 'az_payground/**'
  pull_request:
    branches:
      - main
    paths:
      - 'az_payground/**'
  workflow_dispatch:
    inputs:
      pool_type:
        description: 'VM Pool Type'
        required: true
        default: 'web'
        type: choice
        options:
          - web
          - api
          - worker
      vm_count:
        description: 'Number of VMs'
        required: true
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
      vm_size:
        description: 'VM Size'
        required: true
        default: 'Standard_B2als_v2'
        type: choice
        options:
          - Standard_B1s
          - Standard_B2s
          - Standard_B2als_v2
          - Standard_D2s_v3
          - Standard_D4s_v3
      environment:
        description: 'Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: 'Terraform Action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      resource_prefix:
        description: 'Resource prefix (e.g., omerzlikin-3444d253-9433)'
        required: true
        default: 'omerzlikin'
        type: string
      due_date:
        description: 'Due date for resources (YYYY-MM-DD)'
        required: false
        default: '2026-02-12'
        type: string
      location:
        description: 'Azure Location'
        required: true
        default: 'westeurope'
        type: choice
        options:
          - eastus
          - westeurope


env:
  TF_WORKING_DIR: ${{ github.workspace }}
  # Terraform Azure Provider Environment Variables
  ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
  ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
  ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
  ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
  ARM_USE_MSI: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  terraform-validate:
    name: 'Terraform Validate'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.0

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Setup Terraform Backend
      run: |
        # Set resource prefix from input or default
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          RESOURCE_PREFIX="${{ github.event.inputs.resource_prefix }}"
          DUE_DATE="${{ github.event.inputs.due_date }}"
        else
          RESOURCE_PREFIX="omerzlikin"
          DUE_DATE="2026-02-12"
        fi
        
        LOCATION="${{ github.event.inputs.location }}"
        # Use consistent storage account naming (without timestamp to ensure consistency across jobs)
        STORAGE_NAME="${RESOURCE_PREFIX}tfstates"
        RG_NAME="${RESOURCE_PREFIX}-tfstate-rg"
        
        echo "Creating Terraform state storage with prefix: $RESOURCE_PREFIX"
        echo "Storage account: $STORAGE_NAME"
        echo "Resource group: $RG_NAME"
        echo "Due date: $DUE_DATE"
        
        # Create resource group for Terraform state
        az group create --name "$RG_NAME" --location "$LOCATION" --output none || true
        
        # Create storage account with versioning and RBAC
        az storage account create \
          --name "$STORAGE_NAME" \
          --resource-group "$RG_NAME" \
          --location "$LOCATION" \
          --sku Standard_LRS \
          --kind StorageV2 \
          --allow-blob-public-access false \
          --tags owner=${RESOURCE_PREFIX} createdBy=terraform dueDate="$DUE_DATE" \
          --output none || true

        az storage account blob-service-properties update \
          --resource-group "$RG_NAME" \
          --account-name "$STORAGE_NAME" \
          --enable-versioning true
        
        # Create container for Terraform state
        az storage container create \
          --name "${STORAGE_NAME}-${{ github.event.inputs.environment }}" \
          --account-name "$STORAGE_NAME" \
          --auth-mode login \
          --output none || true
        
        # Get current user/service principal object ID
        # Assign Storage Blob Data Contributor role for RBAC access
        SP_OBJ_ID="$(az ad sp show --id "${ARM_CLIENT_ID}" --query id -o tsv)"
        SA_ID="$(az storage account show -g "$RG_NAME" -n "$STORAGE_NAME" --query id -o tsv)"

        # create only if missing
        if ! az role assignment list --assignee "$SP_OBJ_ID" --scope "$SA_ID" \
          --query "[?roleDefinitionName=='Storage Blob Data Contributor'] | length(@)" -o tsv | grep -qx 1; then
          for i in {1..30}; do
            echo "Attempt Assign Blob Storage Contributor  set ($i/30)..."
            az role assignment create \
              --assignee-object-id "$SP_OBJ_ID" \
              --assignee-principal-type ServicePrincipal \
              --role "Storage Blob Data Contributor" \
              --scope "$SA_ID" \
              -o none
            sleep 5
          done
        fi

        #echo "Setting ACL for Terraform SP..."
        # az storage fs access set \
        #   --account-name "$STORAGE_NAME" \
        #   --file-system tfstate \
        #   --path "/" \
        #   --acl "user:${SP_OBJ_ID}:rwx,default:user:${SP_OBJ_ID}:rwx" \
        #   --auth-mode login
        
        echo "STORAGE_ACCOUNT_NAME=$STORAGE_NAME" >> $GITHUB_ENV
        echo "TFSTATE_RG_NAME=$RG_NAME" >> $GITHUB_ENV
        echo "RESOURCE_PREFIX=$RESOURCE_PREFIX" >> $GITHUB_ENV
        echo "DUE_DATE=$DUE_DATE" >> $GITHUB_ENV

    - name: Key Vault Cleanup
      run: |
        # Set resource prefix and location
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          RESOURCE_PREFIX="${{ github.event.inputs.resource_prefix }}"
          LOCATION="${{ github.event.inputs.location }}"
        else
          RESOURCE_PREFIX="omerzlikin"
          LOCATION="{{ github.event.inputs.location }}"
        fi
        
        KV_NAME="${RESOURCE_PREFIX}-kv"
        
        echo "🧹 Checking for existing/deleted Key Vault: $KV_NAME"
        
        # Check if Key Vault exists in soft-deleted state
        if az keyvault show-deleted --name "$KV_NAME" --location "$LOCATION" --output none 2>/dev/null; then
          echo "⚠️ Found soft-deleted Key Vault, attempting cleanup..."
          
          # Try to purge the soft-deleted Key Vault
          if az keyvault purge --name "$KV_NAME" --location "$LOCATION" --output none 2>/dev/null; then
            echo "🔥 Purging soft-deleted Key Vault..."
            
            # Wait for purge to complete (max 3 minutes)
            PURGE_SUCCESS=false
            for i in {1..18}; do  # 18 attempts * 10 seconds = 3 minutes
              if ! az keyvault show-deleted --name "$KV_NAME" --location "$LOCATION" --output none 2>/dev/null; then
                echo "✅ Key Vault purge completed successfully"
                PURGE_SUCCESS=true
                break
              fi
              echo "Waiting for purge completion... ($i/18)"
              sleep 10
            done
            
            # If purge didn't complete in time, use alternative name
            if [ "$PURGE_SUCCESS" = false ]; then
              echo "⏰ Purge taking too long, using alternative Key Vault name"
              KV_NAME="${RESOURCE_PREFIX}-common-kv"
              echo "🔄 New Key Vault name: $KV_NAME"
              
              # Check if alternative name is also soft-deleted
              if az keyvault show-deleted --name "$KV_NAME" --location "$LOCATION" --output none 2>/dev/null; then
                echo "⚠️ Alternative name also soft-deleted, trying to purge..."
                az keyvault purge --name "$KV_NAME" --location "$LOCATION" --output none 2>/dev/null || true
                sleep 10  # Brief wait for alternative purge
              fi
            fi
          else
            echo "❌ Cannot purge soft-deleted Key Vault (may have purge protection)"
            echo "🔄 Using alternative Key Vault name"
            KV_NAME="${RESOURCE_PREFIX}-common-kv"
            echo "New Key Vault name: $KV_NAME"
          fi
        else
          echo "✅ No soft-deleted Key Vault found, proceeding with creation"
        fi
        
        # Export variables for next steps
        echo "KV_NAME=$KV_NAME" >> $GITHUB_ENV
        echo "RESOURCE_PREFIX=$RESOURCE_PREFIX" >> $GITHUB_ENV
        echo "LOCATION=$LOCATION" >> $GITHUB_ENV

    - name: Create Key Vault and Setup RBAC
      run: |
        echo "🔧 Creating Key Vault: ${{ env.KV_NAME }}"
        
        # Create Key Vault if it doesn't exist
        az keyvault create \
          --name "${{ env.KV_NAME }}" \
          --resource-group "${{ env.TFSTATE_RG_NAME }}" \
          --location "${{ env.LOCATION }}" \
          --sku standard \
          --enable-rbac-authorization true \
          --tags owner=${{ env.RESOURCE_PREFIX }} createdBy=terraform purpose=ssh-keys \
          --output none || true
        
        # Get service principal object ID for RBAC
        SP_OBJ_ID="$(az ad sp show --id "${ARM_CLIENT_ID}" --query id -o tsv)"
        KV_ID="$(az keyvault show --name "${{ env.KV_NAME }}" --resource-group "${{ env.TFSTATE_RG_NAME }}" --query id -o tsv)"
        
        # Assign Key Vault Secrets Officer role to service principal
        echo "🔐 Setting up Key Vault RBAC permissions..."
        if ! az role assignment list --assignee "$SP_OBJ_ID" --scope "$KV_ID" \
          --query "[?roleDefinitionName=='Key Vault Secrets Officer'] | length(@)" -o tsv | grep -qx 1; then
          
          echo "Assigning Key Vault Secrets Officer role to service principal..."
          
          # Retry loop for role assignment
          for i in {1..10}; do
            echo "Attempt to assign Key Vault Secrets Officer role ($i/10)..."
            if az role assignment create \
              --assignee-object-id "$SP_OBJ_ID" \
              --assignee-principal-type ServicePrincipal \
              --role "Key Vault Secrets Officer" \
              --scope "$KV_ID" \
              --output none 2>/dev/null; then
              echo "✅ Role assignment successful"
              break
            else
              echo "⚠️ Role assignment attempt $i failed, retrying in 3 seconds..."
              sleep 3
            fi
            
            # If this is the last attempt, show error but continue
            if [ $i -eq 10 ]; then
              echo "❌ Failed to assign role after 10 attempts, but continuing..."
            fi
          done

          # az role assignment create \
          #     --role "Key Vault Secrets Officer" \
          #     --assignee ${USER} \
          #     --scope "$KV_ID" \
          #     --output none 2>/dev/null
          
          # Wait for role assignment to propagate
          echo "Waiting for RBAC permissions to propagate..."
          sleep 5
        fi

    - name: Setup SSH Key
      run: |
        # SSH key management with GitHub Secrets priority
        if [ -n "${{ secrets.VM_SSH_PUBLIC_KEY }}" ]; then
          echo "✅ Using SSH key from GitHub Secrets"
          echo "SSH_PUBLIC_KEY=${{ secrets.VM_SSH_PUBLIC_KEY }}" >> $GITHUB_ENV
          
          # Validate SSH key format
          if [[ ! "${{ secrets.VM_SSH_PUBLIC_KEY }}" =~ ^ssh-(rsa|ed25519) ]]; then
            echo "❌ Invalid SSH public key format in GitHub Secrets"
            exit 1
          fi
          
          echo "🔑 SSH key from GitHub Secrets configured successfully"
        else
          echo "🔍 GitHub Secret VM_SSH_PUBLIC_KEY not found, using Azure Key Vault..."
          
          # Check for existing SSH key in Key Vault
          echo "🔍 Checking for existing SSH key in Key Vault: ${{ env.KV_NAME }}"
          EXISTING_KEY=$(az keyvault secret show --vault-name "${{ env.KV_NAME }}" --name "vm-ssh-public-key" --query value -o tsv 2>/dev/null || echo "")
          
          if [ -n "$EXISTING_KEY" ]; then
            echo "✅ Using existing SSH key from Azure Key Vault: ${{ env.KV_NAME }}"
            echo "SSH_PUBLIC_KEY=$EXISTING_KEY" >> $GITHUB_ENV
          else
            echo "🔧 Generating new SSH key and storing in Azure Key Vault..."
            
            # Generate SSH key
            ssh-keygen -t rsa -b 4096 -f ~/.ssh/terraform_key -N "" -C "terraform-github-$(date +%Y%m%d-%H%M)"
            PUBLIC_KEY=$(cat ~/.ssh/terraform_key.pub)
            
            # Store in Azure Key Vault for future runs
            az keyvault secret set \
              --vault-name "${{ env.KV_NAME }}" \
              --name "vm-ssh-public-key" \
              --value "$PUBLIC_KEY" \
              --description "SSH public key for Terraform-managed VMs (GitHub Actions)" \
              --output none
            
            echo "✅ SSH key generated and stored in Key Vault: ${{ env.KV_NAME }}"
            echo "💡 For faster access, add this key to GitHub Secrets as VM_SSH_PUBLIC_KEY:"
            echo "$PUBLIC_KEY"
            echo "SSH_PUBLIC_KEY=$PUBLIC_KEY" >> $GITHUB_ENV
          fi
          
          # Validate SSH key format
          if [[ ! "$SSH_PUBLIC_KEY" =~ ^ssh-(rsa|ed25519) ]]; then
            echo "❌ Invalid SSH public key format"
            exit 1
          fi
        fi
        
        echo "🔑 SSH key configured successfully"

    # - name: Setup Terraform Backend
    #   run: |
    #     # Set resource prefix from input or default
    #     if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
    #       RESOURCE_PREFIX="${{ github.event.inputs.resource_prefix }}"
