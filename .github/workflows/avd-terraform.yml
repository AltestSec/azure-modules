    - name: Set Variables
      run: |
        echo "DEV_POOL_SIZE_EU=${{ github.event.inputs.dev_pool_size_eu }}" >> $GITHUB_ENV
        echo "DEV_POOL_SIZE_US=${{ github.event.inputs.dev_pool_size_us }}" >> $GITHUB_ENV
        echo "MGMT_POOL_SIZE_US=${{ github.event.inputs.mgmt_pool_size_us }}" >> $GITHUB_ENV
        echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
        echo "RESOURCE_PREFIX=${{ github.event.inputs.resource_prefix }}" >> $GITHUB_ENV
        echo "DUE_DATE=${{ github.event.inputs.due_date }}" >> $GITHUB_ENV
        echo "PRIMARY_LOCATION=${{ github.event.inputs.primary_location }}" >> $GITHUB_ENV
        echo "SECONDARY_LOCATION=${{ github.event.inputs.secondary_location }}" >> $GITHUB_ENV
        
        # Use consistent storage account naming (without timestamp to ensure consistency across jobs)
        STORAGE_NAME="${{ github.event.inputs.resource_prefix }}avdtfstates"
        RG_NAME="${{ github.event.inputs.resource_prefix }}-avd-tfstate-rg"
        KV_NAME="${{ github.event.inputs.resource_prefix }}-avd-kv"
        
        echo "STORAGE_ACCOUNT_NAME=$STORAGE_NAME" >> $GITHUB_ENV
        echo "TFSTATE_RG_NAME=$RG_NAME" >> $GITHUB_ENV
        echo "KV_NAME=$KV_NAME" >> $GITHUB_ENV

    - name: Retrieve SSH Key
      run: |
        # SSH key retrieval with GitHub Secrets priority
        if [ -n "${{ secrets.VM_SSH_PUBLIC_KEY }}" ]; then
          echo "✅ Using SSH key from GitHub Secrets"
          
          # Validate SSH key format
          if [[ ! "${{ secrets.VM_SSH_PUBLIC_KEY }}" =~ ^ssh-(rsa|ed25519) ]]; then
            echo "❌ Invalid SSH public key format in GitHub Secrets"
            exit 1
          fi
          
          echo "SSH_PUBLIC_KEY=${{ secrets.VM_SSH_PUBLIC_KEY }}" >> $GITHUB_ENV
          echo "🔑 SSH key from GitHub Secrets configured successfully"
        else
          echo "🔍 GitHub Secret VM_SSH_PUBLIC_KEY not found, retrieving from Azure Key Vault..."
          
          # Retrieve SSH key from Key Vault
          echo "🔍 Retrieving SSH key from Key Vault: ${{ env.KV_NAME }}"
          EXISTING_KEY=$(az keyvault secret show --vault-name "${{ env.KV_NAME }}" --name "avd-ssh-public-key" --query value -o tsv 2>/dev/null || echo "")
          
          if [ -n "$EXISTING_KEY" ]; then
            echo "✅ Retrieved SSH key from Azure Key Vault: ${{ env.KV_NAME }}"
            
            # Validate key format
            if [[ ! "$EXISTING_KEY" =~ ^ssh-(rsa|ed25519) ]]; then
              echo "❌ Invalid SSH public key format in Key Vault"
              exit 1
            fi
            
            echo "SSH_PUBLIC_KEY=$EXISTING_KEY" >> $GITHUB_ENV
          else
            echo "❌ SSH key not found in Key Vault. Please run terraform-validate job first to generate SSH key."
            exit 1
          fi
        fi
        
        echo "🔑 SSH key retrieved successfully"

