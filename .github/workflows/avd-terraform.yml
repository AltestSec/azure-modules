        echo "=== AVD RESOURCES TO BE DESTROYED ==="
        cat pre-destroy-costs.txt
        echo "====================================="
        
        # Calculate monthly savings
        MONTHLY_COST=$(infracost breakdown --path . --format json | jq -r '.totalMonthlyCost // "0"')
        echo "💰 Monthly cost savings after destroy: \${MONTHLY_COST}"

