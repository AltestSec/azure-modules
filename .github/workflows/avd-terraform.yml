      run: |
        terraform init \
          -backend-config="storage_account_name=${{ env.STORAGE_ACCOUNT_NAME }}" \
          -backend-config="resource_group_name=${{ env.TFSTATE_RG_NAME }}" \
          -backend-config="container_name=${{ env.STORAGE_ACCOUNT_NAME }}-${{ env.ENVIRONMENT }}" \
          -backend-config="key=avd-terraform.tfstate" \
          -backend-config="use_azuread_auth=true"

    - name: Generate Pre-Destroy Cost Analysis
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
